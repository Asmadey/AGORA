[project]
name = "agora-agent-core"
version = "0.1.0"
description = "AGORA backend: FastAPI + Celery + LangGraph pipeline for synthetic focus groups"
requires-python = ">=3.12"

# Зависимости заводятся по мере реализации задач графа — на #1 нужен только
# работающий контракт сборки (pytest + ruff проходят). Расширяется на #13 (LangGraph),
# #14 (ffmpeg), #15 (faster-whisper + pyannote), #16 (PySceneDetect).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "celery>=5.4",
    "redis>=5.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "psycopg[binary,pool]>=3.2",
    "pymongo>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    # Валидация корпуса и Persona DNA по canonical JSON Schema. Нужна именно 4.x:
    # Draft 2020-12 появился в ней, в 3.2 валидатора для него нет — тест задачи #4
    # на этом падал трассировкой вместо честного SKIP.
    "jsonschema>=4",
    # Генерация Pydantic-моделей из схем (npm run codegen). Без объявления здесь
    # codegen не выполнится ни в CI, ни на чистой машине.
    "datamodel-code-generator>=0.25",
    # Чтение исходных анкет и стенограмм при добавлении нового исследования.
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# Каталог schemas/ целиком генерируется из canonical JSON Schema (npm run codegen).
# Линтовать его бессмысленно: править файлы руками запрещено, а длина строк там
# определяется длиной описаний в схеме. Замечание линтера в таком файле можно
# закрыть только правкой того, что линтер не видит.
extend-exclude = ["agent_core/schemas"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
