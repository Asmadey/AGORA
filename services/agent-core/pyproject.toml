[project]
name = "agora-agent-core"
version = "0.1.0"
description = "AGORA backend: FastAPI + Celery + LangGraph pipeline for synthetic focus groups"
requires-python = ">=3.12"

# Зависимости заводятся по мере реализации задач графа — на #1 нужен только
# работающий контракт сборки (pytest + ruff проходят). Расширяется на #13 (LangGraph),
# #14 (ffmpeg), #15 (faster-whisper + pyannote), #16 (PySceneDetect).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "celery>=5.4",
    "redis>=5.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "psycopg[binary,pool]>=3.2",
    # #13 — оркестратор. Чекпоинтер написан свой (pipeline/checkpoint.py):
    # langgraph-checkpoint-redis требует модулей RediSearch/RedisJSON, то есть
    # Redis Stack, а в развёртывании Valkey 9.1 — этих модулей в нём нет и
    # доставить их нельзя. Пакет установился бы молча и отказал бы при первой
    # записи чекпоинта, то есть уже после транскрипции и вызовов VLM.
    "langgraph>=1.0",
    "pymongo>=4.10",
    # Клиент S3 для забора исходного ролика (agent_core/storage.py). Веб кладёт
    # видео прямо в хранилище подписанной ссылкой, и воркеру надо его оттуда
    # взять — до этого он умел только локальные пути, и загрузка с конвейером
    # были не соединены вовсе.
    "boto3>=1.35",
    # Клиент провайдера моделей. Объявлен здесь, а не в extras, по той же
    # причине, что и torch ниже: без него воркер не выполнит ни разбора кадров
    # (#16), ни прогона респондентов (#18), ни обогащения персон — то есть
    # «необязательная зависимость, без которой ничего не работает».
    #
    # Отсутствовал до этой правки, и обнаружилось это не сборкой и не тестами:
    # все четыре модуля импортируют openai ВНУТРИ функций, поэтому образ
    # собирался, воркер поднимался healthy, а ModuleNotFoundError ждал первого
    # обращения к модели — то есть после оплаченных ffmpeg и транскрипции.
    "openai>=1.50",
    # ─── Распознавание речи: GigaAM ─────────────────────────────────────────
    #
    # Основной движок с 20.08.2026 (docs/ASR_BAKEOFF_2026-08-20.md). Объявлен
    # здесь, а не поставлен руками в Dockerfile: незаявленная зависимость — это
    # ровно тот дефект, который ловит tests/test_dependencies_declared.py, и он
    # его поймал. Образ и pyproject разошлись бы молча: воркер работает, CI
    # собирает окружение из pyproject и получает другое.
    #
    # ─── Почему по коммиту, а не по ветке ────────────────────────────────────
    # Тегов релизов у проекта нет, а `main.zip` — движущаяся мишень: сборка
    # менялась бы под нами без единой правки в репозитории. Коммит обновляется
    # руками и видён в дифференциале.
    #
    # ─── Про onnxruntime ─────────────────────────────────────────────────────
    # gigaam закрепляет `onnxruntime==1.23.*`, и первая редакция ставила его
    # `--no-deps`, чтобы не понизить 1.29. Проверка показала, что бояться было
    # нечего: единственный, кому onnxruntime нужен, — faster-whisper, и он
    # принимает `<2,>=1.14`. sherpa-onnx, на который я тогда сослался, тянет
    # собственный sherpa-onnx-core и питоновский onnxruntime не использует.
    "gigaam @ https://github.com/salute-developers/GigaAM/archive/7447938d791c4f3e643386ee22c33777004293a5.zip",
    # Чтение и нарезка wav для GigaAM. Приезжает и транзитивно (pyannote), но
    # транзитивная зависимость — это чужое решение, которое отменят без нас.
    "soundfile>=0.12",

    # Трассировка вызовов модели. SDK четвёртой мажорной версии — он полностью
    # поддерживается сервером OSS v3 начиная с 3.63.0 (у нас 3.225.2), а третий
    # SDK на нём уже помечен deprecated. Матрица совместимости:
    # https://langfuse.com/self-hosting/upgrade/versioning
    #
    # В основных зависимостях, а не в extras, по той же причине, что и openai:
    # обёртка клиента импортируется из agent_core.tracing, и её отсутствие
    # проявилось бы не сборкой, а ModuleNotFoundError при первом вызове модели,
    # то есть после оплаченных ffmpeg и транскрипции. При этом САМА трассировка
    # необязательна: без ключей модуль отдаёт неизменённый клиент.
    "langfuse>=4.14,<5",
    # #15 — транскрипт и диаризация. Обе библиотеки CPU-only: модели рассуждения
    # ходят по API, локально крутятся только Whisper и pyannote (Decision Log #1).
    #
    # torch тянется как зависимость pyannote.audio и весит ~800 МБ даже в
    # CPU-сборке. Держать его в основных зависимостях, а не в extras, намеренно:
    # воркер без него не выполнит ни одной задачи транскрипции, а «необязательная
    # зависимость, без которой ничего не работает» — это способ узнать о нехватке
    # на проде, а не при сборке.
    "faster-whisper>=1.1",
    # Распознавание через ONNX. onnxruntime уже тянется зависимостями, поэтому
    # второй тяжёлый рантайм здесь не появляется: сам пакет весит 38,5 МБ.
    # Замер 18.08.2026: parakeet-tdt-0.6b-v3 распознаёт 161,6 с дорожки за 24,7 с
    # против 198,1 с у whisper large-v3 на том же железе.
    "sherpa-onnx>=1.10",
    "pyannote.audio>=3.3",
    # #16 — детекция сцен.
    #
    # Экстра opencv-headless обязательна: обычная сборка opencv тянет GUI-
    # библиотеки (GTK, X11), которых в python:3.13-slim нет. Проявилось бы это не
    # при сборке образа, а при первом импорте на проде — «libGL.so.1: cannot open
    # shared object file», то есть как падение воркера посреди задачи.
    #
    # Потолок <0.7 — не осторожность, а замер. В 0.7.x экстру opencv-headless
    # убрали (остались pyav и moviepy), а opencv-python сделали БАЗОВОЙ
    # зависимостью. Спек `scenedetect[opencv-headless]>=0.6.4` на 0.7.1 pip
    # принимает, печатает предупреждение «does not provide the extra» и ставит
    # полную GUI-сборку — то есть тихо делает ровно то, от чего экстра защищала.
    # Проверено 04.08.2026: 0.7.1 → opencv-python 5.0.0.93, 0.6.7.1 →
    # opencv-python-headless 5.0.0.93.
    #
    # Потолок снимается не поднятием версии, а проверкой в тесте #16: она
    # смотрит, какая сборка opencv стоит фактически.
    "scenedetect[opencv-headless]>=0.6.4,<0.7",
    # Ключ провайдера, заданный из интерфейса, лежит в базе ЗАШИФРОВАННЫМ.
    # AES-256-GCM, ключ шифрования — из окружения обоих сервисов.
    #
    # В стандартной библиотеке Python симметричного шифра нет вовсе, поэтому
    # зависимость обязательная: без неё воркер не расшифрует ключ и прогон
    # упадёт на первом обращении к модели — то есть после оплаченных ffmpeg и
    # транскрипции. Ровно так уже вышло с `openai`, которого здесь не было.
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    # Валидация корпуса и Persona DNA по canonical JSON Schema. Нужна именно 4.x:
    # Draft 2020-12 появился в ней, в 3.2 валидатора для него нет — тест задачи #4
    # на этом падал трассировкой вместо честного SKIP.
    "jsonschema>=4",
    # Генерация Pydantic-моделей из схем (npm run codegen). Без объявления здесь
    # codegen не выполнится ни в CI, ни на чистой машине.
    "datamodel-code-generator>=0.25",
    # Чтение исходных анкет и стенограмм при добавлении нового исследования.
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# Каталог schemas/ целиком генерируется из canonical JSON Schema (npm run codegen).
# Линтовать его бессмысленно: править файлы руками запрещено, а длина строк там
# определяется длиной описаний в схеме. Замечание линтера в таком файле можно
# закрыть только правкой того, что линтер не видит.
extend-exclude = ["agent_core/schemas"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
