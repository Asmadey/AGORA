# AGORA — оркестрация локальной/VPS среды (PRD §15, Decision Log #3).
#
# Запуск из корня монорепо:
#   docker compose -f infra/docker-compose.yml --env-file .env.local up -d
#
# Состав на 02.08.2026: Postgres — локальный контейнер, MongoDB и Valkey —
# managed на TimeWeb. Поэтому mongo и valkey объявлены с профилем local-db и
# по умолчанию не поднимаются; их URL берутся из .env.local.
#   обычный запуск:            docker compose ... up -d          (postgres, web, worker)
#   полностью локальный стек:  docker compose ... --profile local-db up -d
#
# Секреты берутся только из env-файла. Значения по умолчанию через :- заданы
# ТОЛЬКО для локальной разработки и не содержат ничего чувствительного.

name: agora

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-agora}
      # Пароль ограниченной роли приложения. Под ней ходят web и worker —
      # НЕ под POSTGRES_USER, иначе RLS обходится владельцем таблиц.
      AGORA_APP_PASSWORD: ${AGORA_APP_PASSWORD:?AGORA_APP_PASSWORD обязателен}
      AGORA_SHARE_PASSWORD: ${AGORA_SHARE_PASSWORD:?AGORA_SHARE_PASSWORD обязателен}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agora} -d ${POSTGRES_DB:-agora}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ─── Локальные БД: только по профилю local-db ──────────────────────────
  # Решение 02.08.2026: MongoDB и Valkey берутся managed на TimeWeb, локально
  # поднимается только Postgres. Профиль означает, что `docker compose up -d`
  # эти сервисы НЕ стартует и `docker compose ps` их не показывает — метрика
  # compose_health перестаёт быть вечно красной из-за контейнера, который никому
  # не нужен. Для полностью автономной разработки без сети:
  #     docker compose --profile local-db up -d
  #
  # depends_on у web и worker на них намеренно снят: зависимость от сервиса с
  # профилем включает этот профиль неявно, и вся конструкция теряет смысл.
  mongo:
    image: mongo:8.0
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-agora}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD обязателен}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-agora}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  valkey:
    image: valkey/valkey:9.1-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET обязателен}
      DATABASE_URL: ${DATABASE_URL:-postgresql://agora_login:${AGORA_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-agora}}
      # Managed на TimeWeb. Умолчание на контейнерные хосты убрано намеренно:
      # сервисы mongo/valkey ушли в профиль local-db, и подстановка mongo:27017
      # означала бы тихую попытку соединиться с несуществующим хостом.
      # При работе с профилем local-db задайте эти URL в .env.local явно.
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL обязателен (managed или local-db)}
      VALKEY_URL: ${VALKEY_URL:?VALKEY_URL обязателен (managed или local-db)}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY обязателен}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.timeweb.cloud/v1}
      AI_MODEL: ${AI_MODEL:-qwen3.6}
    # Только postgres: mongo и valkey вынесены в профиль local-db и по умолчанию
    # не поднимаются (managed на TimeWeb). Зависимость от сервиса с профилем
    # включила бы профиль неявно и вернула бы ненужные контейнеры.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "agent_core.celery_app", "worker", "--loglevel=info", "--concurrency=${WORKER_CONCURRENCY:-4}"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://agora_login:${AGORA_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-agora}}
      # Managed на TimeWeb. Умолчание на контейнерные хосты убрано намеренно:
      # сервисы mongo/valkey ушли в профиль local-db, и подстановка mongo:27017
      # означала бы тихую попытку соединиться с несуществующим хостом.
      # При работе с профилем local-db задайте эти URL в .env.local явно.
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL обязателен (managed или local-db)}
      VALKEY_URL: ${VALKEY_URL:?VALKEY_URL обязателен (managed или local-db)}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY обязателен}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.timeweb.cloud/v1}
      # Обязательный заголовок агента TimeWeb: помечен required в OpenAPI,
      # но OpenAI SDK его не шлёт — без него запрос отклоняется до модели.
      MODEL_PROXY_SOURCE: ${MODEL_PROXY_SOURCE:-agora}
      # Поле model в запросе агент игнорирует — модель задана в его настройках.
      # Значения ниже нужны как подпись в отчёте и снимке задачи.
      AI_MODEL: ${AI_MODEL:-qwen3.6}
      VLM_MODEL: ${VLM_MODEL:-qwen3.6}
      # Второй агент под кадры. Пусто — общий агент, то есть одна модель на всё.
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      # Диаризация локальная. Токен HF нужен и для self-host: веса закрыты
      # принятием условий, без токена загрузка вернёт 401.
      DIARIZATION_PIPELINE: ${DIARIZATION_PIPELINE:-pyannote/speaker-diarization-community-1}
      PYANNOTE_TOKEN: ${PYANNOTE_TOKEN:-}
      PYANNOTE_METRICS_ENABLED: ${PYANNOTE_METRICS_ENABLED:-0}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      # Кэш весов Whisper/pyannote между перезапусками — модели тяжёлые,
      # качать их заново на каждый up слишком дорого. Путь в домашнем каталоге
      # celeryuser, а не в /root: контейнер работает под uid 1001 и в /root
      # (режим 700) писать не может — отказ вылез бы на первой транскрипции.
      - model_cache:/home/celeryuser/.cache
    # Только postgres: mongo и valkey вынесены в профиль local-db и по умолчанию
    # не поднимаются (managed на TimeWeb). Зависимость от сервиса с профилем
    # включила бы профиль неявно и вернула бы ненужные контейнеры.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A agent_core.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  mongo_data:
  valkey_data:
  model_cache:
