# AGORA — оркестрация локальной/VPS среды (PRD §15, Decision Log #3).
#
# Запуск из корня монорепо:
#   docker compose -f infra/docker-compose.yml --env-file .env.local up -d
#
# Состав на 02.08.2026: Postgres — локальный контейнер, MongoDB и Valkey —
# managed на TimeWeb. Поэтому mongo и valkey объявлены с профилем local-db и
# по умолчанию не поднимаются; их URL берутся из .env.local.
#   обычный запуск:            docker compose ... up -d          (postgres, web, worker)
#   полностью локальный стек:  docker compose ... --profile local-db up -d
#
# Секреты берутся только из env-файла. Значения по умолчанию через :- заданы
# ТОЛЬКО для локальной разработки и не содержат ничего чувствительного.

name: agora

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-agora}
      # Пароль ограниченной роли приложения. Под ней ходят web и worker —
      # НЕ под POSTGRES_USER, иначе RLS обходится владельцем таблиц.
      AGORA_APP_PASSWORD: ${AGORA_APP_PASSWORD:?AGORA_APP_PASSWORD обязателен}
      AGORA_SHARE_PASSWORD: ${AGORA_SHARE_PASSWORD:?AGORA_SHARE_PASSWORD обязателен}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agora} -d ${POSTGRES_DB:-agora}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ─── Локальные БД: только по профилю local-db ──────────────────────────
  # Решение 02.08.2026: MongoDB и Valkey берутся managed на TimeWeb, локально
  # поднимается только Postgres. Профиль означает, что `docker compose up -d`
  # эти сервисы НЕ стартует и `docker compose ps` их не показывает — метрика
  # compose_health перестаёт быть вечно красной из-за контейнера, который никому
  # не нужен. Для полностью автономной разработки без сети:
  #     docker compose --profile local-db up -d
  #
  # depends_on у web и worker на них намеренно снят: зависимость от сервиса с
  # профилем включает этот профиль неявно, и вся конструкция теряет смысл.
  mongo:
    image: mongo:8.0
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-agora}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD обязателен}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-agora}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  valkey:
    image: valkey/valkey:9.1-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      # Ключи биллинга для раздела «Статистика». Читает их сервер Next,
      # воркеру они не нужны. Пустые — раздел честно отвечает «не
      # настроено», а не показывает нули.
      CLOUDRU_KEY_ID: ${CLOUDRU_KEY_ID:-}
      CLOUDRU_KEY_SECRET: ${CLOUDRU_KEY_SECRET:-}
      CLOUDRU_PROJECT_ID: ${CLOUDRU_PROJECT_ID:-}
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET обязателен}
      DATABASE_URL: ${DATABASE_URL:-postgresql://agora_login:${AGORA_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-agora}}
      # Managed на TimeWeb. Умолчание на контейнерные хосты убрано намеренно:
      # сервисы mongo/valkey ушли в профиль local-db, и подстановка mongo:27017
      # означала бы тихую попытку соединиться с несуществующим хостом.
      # При работе с профилем local-db задайте эти URL в .env.local явно.
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL обязателен (managed или local-db)}
      VALKEY_URL: ${VALKEY_URL:?VALKEY_URL обязателен (managed или local-db)}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY обязателен}
      # Ключ шифрования секретов арендатора (ключ провайдера, заданный из
      # интерфейса). Обязан СОВПАДАТЬ у web и worker: веб шифрует, воркер
      # расшифровывает. Пусто — интерфейс откажется принимать ключ и скажет
      # почему, вместо того чтобы сохранить его открытым.
      SETTINGS_SECRET: ${SETTINGS_SECRET:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:?OPENAI_BASE_URL обязателен — адреса по умолчанию нет}
      AI_MODEL: ${AI_MODEL:?AI_MODEL обязателен}
      # Модель зрения нужна и вебу — не для вызовов, а чтобы Настройки могли
      # показать, что действует сейчас. Без неё селектор молчит о текущем
      # значении, и выбор делается вслепую.
      VLM_MODEL: ${VLM_MODEL:-}
      # Presigned upload выдаёт web, а не worker: маршрут /api/upload/presign
      # подписывает ссылку ключами S3 и кладёт tenant_id из сессии в имя объекта.
      # Раньше эти переменные были только у worker, поэтому на развёрнутом стенде
      # загрузка отвечала 500 «S3_ACCESS_KEY или S3_SECRET_KEY не заданы».
      # Незаметно это было потому, что тест #8 упирался в 401 раньше, чем
      # доходил до подписи, и дефект выглядел как отсутствие среды.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # Корень, от которого /api/portraits/distill строит путь к distill.py.
      # Без него берётся process.cwd(), а у standalone-сервера Next это
      # /app/apps/web — путь получался /app/apps/web/services/... и дистилляция
      # падала с «can't open file». Умолчание в коде рассчитано на запуск из
      # каталога репозитория, в образе структура другая.
      AGORA_REPO_ROOT: /app
    # Только postgres: mongo и valkey вынесены в профиль local-db и по умолчанию
    # не поднимаются (managed на TimeWeb). Зависимость от сервиса с профилем
    # включила бы профиль неявно и вернула бы ненужные контейнеры.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    restart: unless-stopped
    # Умолчание 1, а не 4. Celery prefork держит по копии процесса на воркер, и
    # каждый, выполнив задачу транскрипции, оставляет модель в памяти (кеш в
    # agent_core/asr обязателен — без него large-v3 грузится заново на каждую
    # задачу). Измерено 04.08.2026: один процесс с large-v3 int8 и pyannote даёт
    # 5,4 ГБ anon-rss. Четыре такие копии не помещаются никуда, а проявилось бы
    # это как случайный OOM посреди прогона, а не как нехватка настройки.
    #
    # Поднимать значение имеет смысл только вместе с памятью: ориентир — 5,5 ГБ
    # на процесс сверх того, что занимают web и postgres.
    # `--beat` поднимает планировщик ВНУТРИ воркера, а не отдельным контейнером.
    #
    # Расписание сейчас одно — сборщик осиротевших прогонов (agora.reap_orphans),
    # раз в 15 минут. Ради одной задачи заводить второй контейнер с тем же
    # образом на 4 ГБ значит платить памятью за планировщик, который просыпается
    # четыре раза в час. Встроенный планировщик не годится при НЕСКОЛЬКИХ узлах
    # воркера — каждый заводил бы свой и задача шла бы кратно, — но узел здесь
    # один, и это записано в docs/AGORA_PRD_FINAL.md §14.
    #
    # Файл расписания уезжает в /tmp: рабочий каталог образа принадлежит root, а
    # процесс идёт под celeryuser, и планировщик молча не смог бы его создать.
    command: ["celery", "-A", "agent_core.celery_app", "worker", "--loglevel=info", "--concurrency=${WORKER_CONCURRENCY:-1}", "--beat", "--schedule=/tmp/celerybeat-schedule"]
    environment: &worker-env
      DATABASE_URL: ${DATABASE_URL:-postgresql://agora_login:${AGORA_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-agora}}
      # Managed на TimeWeb. Умолчание на контейнерные хосты убрано намеренно:
      # сервисы mongo/valkey ушли в профиль local-db, и подстановка mongo:27017
      # означала бы тихую попытку соединиться с несуществующим хостом.
      # При работе с профилем local-db задайте эти URL в .env.local явно.
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL обязателен (managed или local-db)}
      VALKEY_URL: ${VALKEY_URL:?VALKEY_URL обязателен (managed или local-db)}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY обязателен}
      # Ключ шифрования секретов арендатора (ключ провайдера, заданный из
      # интерфейса). Обязан СОВПАДАТЬ у web и worker: веб шифрует, воркер
      # расшифровывает. Пусто — интерфейс откажется принимать ключ и скажет
      # почему, вместо того чтобы сохранить его открытым.
      SETTINGS_SECRET: ${SETTINGS_SECRET:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:?OPENAI_BASE_URL обязателен — адреса по умолчанию нет}
      # Обязательный заголовок агента TimeWeb: помечен required в OpenAPI,
      # но OpenAI SDK его не шлёт — без него запрос отклоняется до модели.
      MODEL_PROXY_SOURCE: ${MODEL_PROXY_SOURCE:-agora}
      # Поле model в запросе агент игнорирует — модель задана в его настройках.
      # Значения ниже нужны как подпись в отчёте и снимке задачи.
      AI_MODEL: ${AI_MODEL:?AI_MODEL обязателен}
      VLM_MODEL: ${VLM_MODEL:?VLM_MODEL обязателен — разбор кадров идёт в модель зрения}
      # Второй агент под кадры. Пусто — общий агент, то есть одна модель на всё.
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      # Запасное умолчание для задач БЕЗ снимка настроек — то есть для тех,
      # что поставлены до появления настроек. Обязано совпадать с первым
      # элементом WHISPER_MODELS в agent_core/config.py: иначе прогон без
      # снимка молча пойдёт другой моделью, чем показывает интерфейс, и
      # отличить это можно будет только по тексту расшифровки.
      WHISPER_MODEL: ${WHISPER_MODEL:-gigaam-v3-e2e-rnnt}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      # Диаризация локальная. Токен HF нужен и для self-host: веса закрыты
      # принятием условий, без токена загрузка вернёт 401.
      DIARIZATION_PIPELINE: ${DIARIZATION_PIPELINE:-pyannote/speaker-diarization-community-1}
      PYANNOTE_TOKEN: ${PYANNOTE_TOKEN:-}
      PYANNOTE_METRICS_ENABLED: ${PYANNOTE_METRICS_ENABLED:-0}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # ─── Трассировка ────────────────────────────────────────────────────
      # Все три со значением по умолчанию «пусто», и это не небрежность:
      # agent_core.tracing включается только при всех трёх заполненных, а
      # обязательные переменные (`:?`) сделали бы наблюдение условием запуска
      # продукта. Разработчик без LangFuse не должен получать отказ compose.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      # Разделяет трассы боевого сервера и локальных прогонов в одном
      # проекте. Имя переменной — то, что читает сам SDK: своё завести
      # значило бы иметь два источника правды и разойтись с документацией.
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-production}
    volumes:
      # Кэш весов Whisper/pyannote между перезапусками — модели тяжёлые,
      # качать их заново на каждый up слишком дорого. Путь в домашнем каталоге
      # celeryuser, а не в /root: контейнер работает под uid 1001 и в /root
      # (режим 700) писать не может — отказ вылез бы на первой транскрипции.
      - model_cache:/home/celeryuser/.cache
    # Только postgres: mongo и valkey вынесены в профиль local-db и по умолчанию
    # не поднимаются (managed на TimeWeb). Зависимость от сервиса с профилем
    # включила бы профиль неявно и вернула бы ненужные контейнеры.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A agent_core.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Синхронный агент чата по результатам (#28) ─────────────────────────────
  #
  # Тот же образ, что у воркера, другая команда. Не второй образ и не новые
  # зависимости: `agent_core/api` написан давно и до сих пор не запускался
  # нигде — контейнер выполнял только celery worker.
  #
  # ПОЧЕМУ ОТДЕЛЬНАЯ СЛУЖБА, А НЕ ЗАДАЧА В ОЧЕРЕДИ. Чат синхронен: человек ждёт
  # ответ секунды. Очередь занята часовыми прогонами, и реплика встала бы за
  # распознаванием речи. Ставить чат в ту же очередь значит сделать его
  # неотзывчивым ровно тогда, когда идёт исследование, — то есть когда о нём и
  # спрашивают.
  #
  # ПОЧЕМУ НЕ МАРШРУТ NEXT.JS. В образе веба нет `openai`. Агент на TypeScript
  # означал бы вторую реализацию разбора промптов, has_support, температур и
  # трассировки — тот класс дефекта, который в этом проекте повторялся трижды.
  #
  # НАРУЖУ НЕ ПУБЛИКУЕТСЯ: ни `ports`, ни маршрута в nginx. Служба видна только
  # внутри сети compose, и зовёт её только веб — уже проверивший сессию, роль и
  # принадлежность прогона арендатору.
  agent-api:
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "agent_core.api.app:app", "--host", "0.0.0.0", "--port", "8001"]
    # Ровно то же окружение, что у воркера: он читает те же промпты, ту же базу
    # и тот же Mongo. Копия этих сорока строк разошлась бы с оригиналом при
    # первой правке, и разошлась бы молча.
    environment: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  mongo_data:
  valkey_data:
  model_cache:
